[package]
name = "architecture-analyzer"
version = "0.1.0"
edition = "2021"
description = "Reusable preservation-first architecture analyzer (Phase 4 tool)"
license = "GPL-3.0-only"

[workspace]

[lib]
name = "architecture_analyzer"
path = "src/lib.rs"

[[bin]]
name = "architecture-analyzer"
path = "src/main.rs"

[dependencies]
cargo_metadata = "0.18"
syn = { version = "2", features = ["full", "parsing", "extra-traits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
