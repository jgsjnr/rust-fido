[build]
target-dir = "C:/t"

[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
runner = "cargo espflash flash --monitor"
rustflags = [
  "-C", "default-linker-libraries",
  "-C", "link-arg=-Wl,--allow-multiple-definition",
]

[target.xtensa-esp32-espidf]
linker = "ldproxy"
runner = "cargo espflash flash --monitor"
rustflags = [
  "-C", "default-linker-libraries",
  "-C", "link-arg=-Wl,--allow-multiple-definition",
]

[env]
LIBCLANG_PATH = "C:\\Users\\junior\\.rustup\\toolchains\\esp\\xtensa-esp32-elf-clang\\esp-clang\\bin\\libclang.dll"
ESP_IDF_VERSION = "v5.3.1"
IDF_PATH = "C:\\.embuild\\espressif\\esp-idf\\v5.3.1"
IDF_TOOLS_PATH = "C:\\.embuild\\espressif"
ESP_IDF_SYS_ROOT_CRATE = "aegis-fido-firmware"
ESP_IDF_TOOLS_INSTALL_DIR = "fromenv"
CARGO_WORKSPACE_DIR = { value = "", relative = true }
TEMP = "C:\\Users\\junior\\AppData\\Local\\Temp"
TMP = "C:\\Users\\junior\\AppData\\Local\\Temp"
