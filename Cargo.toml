[workspace]
resolver = "2"
members = [
    "crates/aegis-fido-core",
    "crates/aegis-fido-usb",
    "crates/aegis-fido-firmware",
    "crates/uniffi-bridge",
]
exclude = ["tools/uniffi-gen"]

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["Aegis Security <contact@aegiskey.dev>"]
license = "GPL-3.0-only"
repository = "https://github.com/jgsjnr/rust-fido.git"

[workspace.dependencies]
# Serialization & CBOR
ciborium = "0.2"
serde = { version = "=1.0.217", default-features = false, features = ["derive", "alloc"] }
serde_bytes = { version = "=0.11.16", default-features = false, features = ["alloc"] }

# Cryptography
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic"] }
p521 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic"] }
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["rand_core"] }
sha2 = { version = "0.10", default-features = false }
sha1 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
aes-gcm = { version = "0.10", default-features = false, features = ["aes"] }
aes = { version = "0.8", default-features = false }
bip39 = { version = "2.1", default-features = false }
zeroize = { version = "1.8", default-features = false, features = ["alloc", "derive"] }
rand_core = { version = "0.6", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }

# Logging
log = "0.4"