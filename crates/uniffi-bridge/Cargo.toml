[package]
name = "uniffi-bridge"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "UniFFI bridge (cdylib) re-exporting aegis-fido-core for the Android app: CBOR/COSE parse-only, AEGN envelope AES-GCM seal/open, TOTP display-only verify. Never generates or stores keys/secrets."

[lib]
name = "aegis_bridge"
crate-type = ["cdylib", "rlib"]

[dependencies]
aegis-fido-core = { path = "../aegis-fido-core" }
universal-device-sdk = { path = "../universal-device-sdk" }
uniffi = { version = "0.28", features = ["build"] }
zeroize = { workspace = true }

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }
