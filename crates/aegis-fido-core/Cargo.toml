[package]
name = "aegis-fido-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ciborium = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
p256 = { workspace = true, features = ["ecdh"] }
p384 = { workspace = true }
p521 = { workspace = true, features = ["sha512", "getrandom"] }
k256 = { workspace = true }
ed25519-dalek = { workspace = true }
signature = { version = "2.2", default-features = false }
sha2 = { workspace = true }
sha1 = { workspace = true }
hmac = { workspace = true }
aes = { workspace = true }
aes-gcm = { workspace = true, features = ["alloc"] }
bip39 = { workspace = true, features = ["alloc"] }
zeroize = { workspace = true }
rand_core = { workspace = true }
subtle = { version = "2.6", default-features = false }
hex = { workspace = true }
sha3 = { workspace = true }
ripemd = { workspace = true }
bech32 = { workspace = true }
bs58 = { workspace = true }
log = { workspace = true }

[dev-dependencies]
rand = "0.8"

[features]
# Wave7: lifetime debug counters (default OFF; release builds compile ltrace! to nothing).
debug-terminal = []
