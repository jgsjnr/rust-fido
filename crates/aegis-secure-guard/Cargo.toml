[package]
name = "aegis-secure-guard"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
sha2 = { workspace = true }
hmac = { workspace = true }
p256 = { workspace = true, features = ["ecdh"] }
hkdf = "0.12"
subtle = { version = "2.6", default-features = false }
zeroize = { workspace = true }
rand_core = { workspace = true }

[dev-dependencies]
rand = "0.10"

[features]
# DEV-only gate for the on-device recovery-code cache (`dev_recovery_cache`).
# Never enabled in release/default builds: the module is declared ONLY under
# this feature, so any release-path reference fails compilation. No default
# features exist in this crate, and no release profile enables `test-mode`.
test-mode = []
