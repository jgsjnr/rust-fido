[package]
name = "aegis-fido-firmware"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["board-devkitc"]
board-devkitc = []
board-t-display = []
board-ttgo-classic = []
ble = []
menu = []
wifi = []
proximity = []
# Wave7: lifetime monitor lines (default OFF; release = ltrace! no-op).
debug-terminal = ["aegis-fido-core/debug-terminal"]
# Wave7: TEST_LIFETIME_DUMP serial diagnostic (default OFF; absent without it).
test-mode = []

[dependencies]
aegis-fido-core = { path = "../aegis-fido-core" }
aegis-fido-usb = { path = "../aegis-fido-usb" }
embedded-graphics = "0.8"
ciborium = { workspace = true }
log = { workspace = true }
hmac = { workspace = true }
aes-gcm = { workspace = true, features = ["alloc"] }
sha2 = { workspace = true }
rand_core = { workspace = true }
p256 = { workspace = true }
ed25519-dalek = { workspace = true }
signature = { version = "2.2", default-features = false }
zeroize = { workspace = true }
hex = { workspace = true }

[target.'cfg(target_os = "espidf")'.dependencies]
esp-idf-sys = { version = "0.36", default-features = false, features = ["binstart"] }
esp-idf-svc = { version = "0.50", default-features = false, features = ["binstart"] }
esp-idf-hal = { version = "0.45", default-features = false }

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }

[package.metadata.esp-idf-sys]
esp_idf_component_manager = false
extra_components = [
    { component_dirs = [ "components/tinyusb", "components/esp_tinyusb", "components/aegis_usb", "components/aegis_ble", "components/aegis_wifi" ] }
]


