[package]
name = "aegis-fido-firmware"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# aegis-fido-core = { path = "../aegis-fido-core" }
aegis-fido-usb = { path = "../aegis-fido-usb" }
log = { workspace = true }
hmac = { workspace = true }
aes-gcm = { workspace = true, features = ["alloc"] }
sha2 = { workspace = true }
rand_core = { workspace = true }
zeroize = { workspace = true }
hex = { workspace = true }

[target.'cfg(target_os = "espidf")'.dependencies]
esp-idf-sys = { version = "0.36", default-features = false }
esp-idf-svc = { version = "0.50", default-features = false }
esp-idf-hal = { version = "0.45", default-features = false }

[target.'cfg(target_os = "espidf")'.build-dependencies]
embuild = "0.33"
