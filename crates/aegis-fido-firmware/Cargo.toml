[package]
name = "aegis-fido-firmware"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["board-devkitc"]
board-devkitc = []
has-display = ["dep:embedded-graphics"]
board-t-display = ["has-display"]
board-ttgo-classic = ["has-display"]
ble = []
menu = []
wifi = []
proximity = []
# Wave7: lifetime monitor lines (default OFF; release = ltrace! no-op).
debug-terminal = ["aegis-fido-core/debug-terminal"]
# Wave7: TEST_LIFETIME_DUMP serial diagnostic (default OFF; absent without it).
test-mode = []
# GAP-04: Strict production mode: disallows test hooks, simulated touch, and debug bypasses
prod-strict = []
# Variante FreeRTOS em Rust (tasks + queue + event-group; ver src/freertos.rs).
freertos = []

[dependencies]
aegis-secure-guard = { path = "../aegis-secure-guard" }
aegis-fido-core = { path = "../aegis-fido-core" }
aegis-fido-usb = { path = "../aegis-fido-usb" }
embedded-graphics = { version = "0.8", optional = true }
ciborium = { workspace = true }
log = { workspace = true }
hmac = { workspace = true }
aes = { workspace = true }
aes-gcm = { workspace = true, features = ["alloc"] }
sha2 = { workspace = true }
sha1 = { workspace = true }
rand_core = { workspace = true }
getrandom = { version = "0.4", features = ["sys_rng"] }
p256 = { workspace = true }
p384 = { workspace = true }
ed25519-dalek = { workspace = true }
signature = { version = "3.0", default-features = false }
zeroize = { workspace = true }
hex = { workspace = true }

[target.'cfg(target_os = "espidf")'.dependencies]
esp-idf-sys = { version = "0.38", default-features = false, features = ["binstart"] }
esp-idf-svc = { version = "0.53", default-features = false, features = ["binstart", "alloc"] }
esp-idf-hal = { version = "0.47", default-features = false }

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }

[dev-dependencies]
rand = "0.10"

[package.metadata.esp-idf-sys]
esp_idf_component_manager = true

[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = [ "components/aegis_usb", "components/aegis_ble", "components/aegis_wifi" ]

# IDF v6.0: esp_tinyusb moved out-of-tree (managed component; EIM local storage
# C:\Espressif\tools\components\espressif\esp_tinyusb\2.4.0, targets esp32s3).
# Requires the component manager ON (flipped above). NOTE: aegis_usb CMakeLists
# still PRIV_REQUIRES the v5 in-tree names `tinyusb`/`usb` -> cmake configure
# BLOCKED there (product-component change, follow-up lane). This entry only
# resolves `espressif__esp_tinyusb`.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_tinyusb", version = "2.*" }


