[package]
name = "universal-device-sdk"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "universal_device_sdk"
crate-type = ["rlib"]

[dependencies]
sha3 = { workspace = true, optional = true }
ripemd = { workspace = true, optional = true }
bech32 = { workspace = true, optional = true }
bs58 = { workspace = true, optional = true }
ciborium = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }

[features]
default = ["fido", "hardwallet", "secmon"]
fido = []
hardwallet = ["dep:sha3", "dep:ripemd", "dep:bech32", "dep:bs58"]
secmon = []
# Password-manager blind transport (F-PM2): DTOs/CBOR only, vault-agnostic.
# Off by default; off yields `SdkError::NotCompiled` (R12).
pm = []
# Lab-only: never in `default`; without it there is no test surface at all.
test-mode = []
# Phase 0 contract-only gates (R12): empty, off by default.
ota = []
piv = []
otp = []
proximity = []
oath = []
backup = []
audit = []
policy = []
